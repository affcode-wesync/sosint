<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рыбалка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;height:100dvh;background:#0a1628;font-family:'Segoe UI',Tahoma,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
.ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:10;pointer-events:none}
.ui>*{pointer-events:auto}
.back{background:rgba(0,0,0,.5);border:1px solid rgba(255,215,0,.3);color:#ffd700;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;backdrop-filter:blur(4px)}
.back:hover{background:rgba(255,215,0,.15)}
.stats{display:flex;gap:16px;background:rgba(0,0,0,.5);padding:6px 16px;border-radius:10px;backdrop-filter:blur(4px)}
.stat{text-align:center}
.stat .l{font-size:9px;color:#8b7355;text-transform:uppercase}
.stat .v{font-size:18px;font-weight:700;color:#ffd700}
.stat .v.w{color:#fff}
.coins{font-size:14px;color:#ffd700;font-weight:700;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:10px;backdrop-filter:blur(4px)}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:12px;z-index:10;pointer-events:none}
.hint{background:rgba(0,0,0,.6);color:#ffd700;padding:8px 20px;border-radius:10px;font-size:13px;font-weight:600;backdrop-filter:blur(4px);pointer-events:auto;text-align:center;transition:opacity .3s}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(135deg,#1a2a3a,#0d1f2a);border:2px solid rgba(255,215,0,.3);border-radius:14px;padding:24px;text-align:center;max-width:300px;width:88%;animation:mIn .3s}
@keyframes mIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:24px;margin-bottom:8px;background:linear-gradient(135deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal .fish-info{font-size:14px;color:#e8e0d4;margin:8px 0}
.modal .fish-emoji{font-size:48px;margin:8px 0}
.modal .reward{font-size:16px;color:#ffd700;font-weight:700;margin:8px 0}
.modal button{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin:4px;background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1535}
.modal button:hover{transform:scale(1.05)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui">
  <a href="index.html" class="back">← Игры</a>
  <div class="stats">
    <div class="stat"><div class="l">Поймано</div><div class="v w" id="caught">0</div></div>
    <div class="stat"><div class="l">Рекорд</div><div class="v w" id="best">0</div></div>
  </div>
  <div class="coins" id="coins">🪙 0</div>
</div>
<div class="bottom"><div class="hint" id="hint">Нажмите на воду чтобы забросить удочку</div></div>
<div class="modal-bg" id="modal"><div class="modal" id="modalInner"></div></div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
let W,H,dpr;
function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
}
resize();window.addEventListener('resize',resize);

// State
let coins=parseInt(localStorage.getItem('fish_coins')||'0');
let best=parseInt(localStorage.getItem('fish_best')||'0');
let state='idle'; // idle, casting, waiting, bite, reeling, caught
let lineX=0,lineY=0,hookX=0,hookY=0;
let targetX=0,targetY=0;
let biteTimer=0,biteFish=null;
let reelProgress=0;
let caughtCount=0;
let time=0;
let bubbles=[];
let fishes=[];
let ripples=[];
let clouds=[];
let waves=[];

// Fish types
const FISH=[
  {name:'Карась',emoji:'🐟',weight:[0.2,1.5],speed:1,color:'#c0a040',value:10,bite:0.3},
  {name:'Окунь',emoji:'🐠',weight:[0.3,2],speed:1.5,color:'#4a8a3a',value:15,bite:0.25},
  {name:'Щука',emoji:'🐟',weight:[0.5,4],speed:2,color:'#5a6a3a',value:25,bite:0.2},
  {name:'Лещ',emoji:'🐡',weight:[0.4,2.5],speed:0.8,color:'#8a7a50',value:20,bite:0.35},
  {name:'Сом',emoji:'🐟',weight:[1,6],speed:1.2,color:'#3a3a3a',value:40,bite:0.15},
  {name:'Судак',emoji:'🐠',weight:[0.8,3.5],speed:1.8,color:'#7a8a6a',value:35,bite:0.18},
  {name:'Золотая рыбка',emoji:'✨',weight:[0.1,0.5],speed:3,color:'#ffd700',value:100,bite:0.05},
];

// Init
function init(){
  for(let i=0;i<4;i++){
    clouds.push({x:Math.random()*W,y:20+Math.random()*60,w:60+Math.random()*120,h:20+Math.random()*20,speed:0.2+Math.random()*0.3});
  }
  for(let i=0;i<5;i++){
    spawnFish();
  }
  for(let i=0;i<8;i++){
    waves.push({x:Math.random()*W,y:H*0.45+Math.random()*20,amp:2+Math.random()*4,freq:0.02+Math.random()*0.02,phase:Math.random()*Math.PI*2,speed:0.5+Math.random()*0.5});
  }
  updateUI();
}

function spawnFish(){
  let f=FISH[Math.floor(Math.random()*FISH.length)];
  let side=Math.random()>0.5?1:-1;
  fishes.push({
    type:f,x:side>0?W+50:-50,y:H*0.5+Math.random()*H*0.35,
    vx:side*-(0.3+f.speed*0.5),size:20+f.weight[0]*8,
    color:f.color,wobble:Math.random()*Math.PI*2,
    dir:side,alive:true
  });
}

function updateUI(){
  document.getElementById('caught').textContent=caughtCount;
  document.getElementById('best').textContent=best;
  document.getElementById('coins').textContent='🪙 '+coins;
}

// Input
cv.addEventListener('pointerdown',e=>{
  if(state!=='idle')return;
  let x=e.clientX,y=e.clientY;
  if(y<H*0.4)return;
  state='casting';
  lineX=W/2;lineY=H*0.38;
  targetX=x;targetY=Math.min(y,H*0.85);
  hookX=lineX;hookY=lineY;
  document.getElementById('hint').textContent='Заброс...';
});

// Game loop
function update(dt){
  time+=dt;
  // Clouds
  clouds.forEach(c=>{c.x+=c.speed;if(c.x>W+150)c.x=-150;});
  // Waves
  waves.forEach(w=>{w.phase+=w.speed*dt;});
  // Fish
  fishes.forEach(f=>{
    if(!f.alive)return;
    f.x+=f.vx;
    f.wobble+=dt*2;
    f.y+=Math.sin(f.wobble)*0.3;
    if(f.dir>0&&f.x<-100)f.alive=false;
    if(f.dir<0&&f.x>W+100)f.alive=false;
  });
  fishes=fishes.filter(f=>f.alive);
  while(fishes.length<5)spawnFish();
  // Bubbles
  if(Math.random()<0.02){
    bubbles.push({x:Math.random()*W,y:H*0.5+Math.random()*H*0.35,r:1+Math.random()*3,vy:-0.3-Math.random()*0.5,life:1});
  }
  bubbles.forEach(b=>{b.y+=b.vy;b.life-=0.005;});
  bubbles=bubbles.filter(b=>b.life>0);
  // Ripples
  ripples.forEach(r=>{r.r+=0.5;r.life-=0.01;});
  ripples=ripples.filter(r=>r.life>0);

  // State machine
  if(state==='casting'){
    let dx=targetX-hookX,dy=targetY-hookY;
    let dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<5){
      hookX=targetX;hookY=targetY;
      state='waiting';
      ripples.push({x:hookX,y:hookY,r:5,life:1});
      document.getElementById('hint').textContent='Ждём клёва...';
      biteTimer=60+Math.random()*120;
    }else{
      hookX+=dx*0.08;hookY+=dy*0.08;
    }
  }
  if(state==='waiting'){
    biteTimer--;
    hookY+=Math.sin(time*2)*0.2;
    if(biteTimer<=0){
      // Find nearby fish
      let near=null,minD=Infinity;
      fishes.forEach(f=>{
        if(!f.alive)return;
        let d=Math.hypot(f.x-hookX,f.y-hookY);
        if(d<100&&d<minD&&Math.random()<f.type.bite){minD=d;near=f;}
      });
      if(near){
        state='bite';biteFish=near;
        document.getElementById('hint').textContent='🐟 КЛЮЁТ! Нажмите!';
        document.getElementById('hint').style.color='#ff4757';
        biteTimer=90;
      }else{
        biteTimer=60+Math.random()*120;
      }
    }
  }
  if(state==='bite'){
    hookY+=Math.sin(time*10)*3;
    biteTimer--;
    if(biteTimer<=0){
      state='idle';biteFish=null;
      document.getElementById('hint').textContent='Рыба ушла... Попробуйте снова';
      document.getElementById('hint').style.color='#ffd700';
    }
  }
  if(state==='reeling'){
    reelProgress+=0.02;
    hookY+=(lineY-hookY)*0.03;
    hookX+=(lineX-hookX)*0.03;
    if(biteFish){
      biteFish.x+=(lineX-biteFish.x)*0.03;
      biteFish.y+=(lineY-biteFish.y)*0.03;
    }
    if(reelProgress>=1){
      state='caught';
      showCatch();
    }
  }
}

cv.addEventListener('pointerdown',e=>{
  if(state==='bite'){
    state='reeling';reelProgress=0;
    document.getElementById('hint').textContent='Тянете рыбу!';
    document.getElementById('hint').style.color='#2ecc71';
  }
});

function showCatch(){
  let f=biteFish.type;
  let w=(f.weight[0]+Math.random()*(f.weight[1]-f.weight[0])).toFixed(1);
  let earned=f.value+Math.floor(w*10);
  coins+=earned;caughtCount++;
  if(caughtCount>best){best=caughtCount;localStorage.setItem('fish_best',best);}
  localStorage.setItem('fish_coins',coins);
  updateUI();
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalInner').innerHTML=`
    <div class="fish-emoji">${f.emoji}</div>
    <h2>${f.name}</h2>
    <div class="fish-info">Вес: ${w} кг</div>
    <div class="reward">+${earned} 🪙</div>
    <button onclick="closeCatch()">Отпустить</button>
  `;
  biteFish.alive=false;biteFish=null;
}

function closeCatch(){
  document.getElementById('modal').classList.remove('show');
  state='idle';
  document.getElementById('hint').textContent='Нажмите на воду чтобы забросить удочку';
  document.getElementById('hint').style.color='#ffd700';
}

function draw(){
  cx.clearRect(0,0,W,H);
  // Sky gradient
  let sky=cx.createLinearGradient(0,0,0,H*0.5);
  sky.addColorStop(0,'#0a1628');sky.addColorStop(0.4,'#1a3050');sky.addColorStop(0.7,'#2a4a6a');sky.addColorStop(1,'#3a6080');
  cx.fillStyle=sky;cx.fillRect(0,0,W,H*0.5);
  // Moon
  cx.fillStyle='rgba(255,250,230,0.9)';cx.beginPath();cx.arc(W*0.8,H*0.12,25,0,Math.PI*2);cx.fill();
  cx.fillStyle='rgba(255,250,230,0.15)';cx.beginPath();cx.arc(W*0.8,H*0.12,40,0,Math.PI*2);cx.fill();
  // Stars
  cx.fillStyle='rgba(255,255,255,0.6)';
  for(let i=0;i<30;i++){
    let sx=(i*137.5+i*i*3)%W,sy=(i*97.3+i*i*7)%(H*0.35);
    let blink=Math.sin(time*2+i)*0.3+0.7;
    cx.globalAlpha=blink*0.8;cx.fillRect(sx,sy,1.5,1.5);
  }
  cx.globalAlpha=1;
  // Clouds
  cx.fillStyle='rgba(100,130,160,0.15)';
  clouds.forEach(c=>{
    cx.beginPath();
    cx.ellipse(c.x,c.y,c.w/2,c.h/2,0,0,Math.PI*2);
    cx.fill();
    cx.beginPath();cx.ellipse(c.x-c.w*0.3,c.y+5,c.w*0.3,c.h*0.4,0,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.ellipse(c.x+c.w*0.3,c.y+3,c.w*0.25,c.h*0.35,0,0,Math.PI*2);cx.fill();
  });
  // Mountains
  cx.fillStyle='#0d1a2a';
  cx.beginPath();cx.moveTo(0,H*0.45);
  cx.lineTo(W*0.1,H*0.32);cx.lineTo(W*0.25,H*0.4);cx.lineTo(W*0.4,H*0.28);
  cx.lineTo(W*0.55,H*0.38);cx.lineTo(W*0.7,H*0.3);cx.lineTo(W*0.85,H*0.36);
  cx.lineTo(W,H*0.42);cx.lineTo(W,H*0.5);cx.lineTo(0,H*0.5);
  cx.fill();
  // Trees silhouette
  cx.fillStyle='#0a1520';
  for(let i=0;i<15;i++){
    let tx=i*(W/14)-10,ty=H*0.42+Math.sin(i*2)*10;
    let th=20+Math.sin(i*3)*15;
    cx.beginPath();cx.moveTo(tx,ty);cx.lineTo(tx+8,ty-th);cx.lineTo(tx+16,ty);cx.fill();
  }
  // Water
  let water=cx.createLinearGradient(0,H*0.45,0,H);
  water.addColorStop(0,'#0a2a4a');water.addColorStop(0.3,'#0d3050');water.addColorStop(0.7,'#0a2540');water.addColorStop(1,'#061828');
  cx.fillStyle=water;cx.fillRect(0,H*0.45,W,H*0.55);
  // Water surface waves
  cx.strokeStyle='rgba(100,180,255,0.1)';cx.lineWidth=1;
  waves.forEach(w=>{
    cx.beginPath();
    for(let x=0;x<W;x+=4){
      let y=w.y+Math.sin(x*w.freq+w.phase)*w.amp;
      x===0?cx.moveTo(x,y):cx.lineTo(x,y);
    }
    cx.stroke();
  });
  // Water shimmer
  for(let i=0;i<20;i++){
    let sx=(i*97+time*10)%W;
    let sy=H*0.5+Math.sin(time+i)*20+i*8;
    cx.fillStyle=`rgba(100,180,255,${0.03+Math.sin(time*0.5+i)*0.02})`;
    cx.fillRect(sx,sy,30+Math.sin(time+i)*10,1);
  }
  // Fish underwater
  fishes.forEach(f=>{
    if(!f.alive)return;
    cx.save();cx.translate(f.x,f.y);
    if(f.dir<0)cx.scale(-1,1);
    // Body
    cx.fillStyle=f.color;
    cx.beginPath();
    cx.ellipse(0,0,f.size,f.size*0.4,0,0,Math.PI*2);
    cx.fill();
    // Fin
    cx.fillStyle=f.color+'aa';
    cx.beginPath();cx.moveTo(-f.size*0.3,-f.size*0.3);cx.lineTo(-f.size*0.1,-f.size*0.6);cx.lineTo(f.size*0.1,-f.size*0.3);cx.fill();
    // Tail
    cx.beginPath();cx.moveTo(-f.size,0);cx.lineTo(-f.size*1.3,-f.size*0.3);cx.lineTo(-f.size*1.3,f.size*0.3);cx.fill();
    // Eye
    cx.fillStyle='#fff';cx.beginPath();cx.arc(f.size*0.5,-f.size*0.1,f.size*0.12,0,Math.PI*2);cx.fill();
    cx.fillStyle='#000';cx.beginPath();cx.arc(f.size*0.55,-f.size*0.1,f.size*0.06,0,Math.PI*2);cx.fill();
    cx.restore();
  });
  // Bubbles
  bubbles.forEach(b=>{
    cx.strokeStyle=`rgba(150,200,255,${b.life*0.4})`;
    cx.lineWidth=0.5;
    cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.stroke();
  });
  // Ripples
  ripples.forEach(r=>{
    cx.strokeStyle=`rgba(150,200,255,${r.life*0.5})`;
    cx.lineWidth=1;
    cx.beginPath();cx.ellipse(r.x,r.y,r.r,r.r*0.3,0,0,Math.PI*2);cx.stroke();
  });
  // Fishing rod + line
  if(state!=='idle'){
    let rodTipX=W/2-40,rodTipY=H*0.35;
    // Rod
    cx.strokeStyle='#8B4513';cx.lineWidth=3;
    cx.beginPath();cx.moveTo(W/2-80,H*0.42);cx.quadraticCurveTo(W/2-60,H*0.36,rodTipX,rodTipY);cx.stroke();
    cx.strokeStyle='#654321';cx.lineWidth=2;
    cx.beginPath();cx.moveTo(W/2-80,H*0.42);cx.quadraticCurveTo(W/2-60,H*0.36,rodTipX,rodTipY);cx.stroke();
    // Line
    cx.strokeStyle='rgba(200,200,200,0.6)';cx.lineWidth=1;
    cx.beginPath();cx.moveTo(rodTipX,rodTipY);
    let midX=(rodTipX+hookX)/2,midY=Math.max(rodTipY,hookY)-20;
    cx.quadraticCurveTo(midX,midY,hookX,hookY);cx.stroke();
    // Hook
    cx.strokeStyle='#ccc';cx.lineWidth=1.5;
    cx.beginPath();cx.arc(hookX,hookY+5,4,0,Math.PI);cx.stroke();
    cx.beginPath();cx.moveTo(hookX,hookY+5);cx.lineTo(hookX+3,hookY+1);cx.stroke();
    // Bobber
    if(state==='waiting'||state==='bite'){
      cx.fillStyle='#ff4444';cx.beginPath();cx.arc(hookX,hookY-3,4,0,Math.PI*2);cx.fill();
      cx.fillStyle='#fff';cx.beginPath();cx.arc(hookX,hookY-3,2,0,Math.PI*2);cx.fill();
    }
    // Bite effect
    if(state==='bite'){
      cx.strokeStyle='rgba(255,200,0,0.5)';cx.lineWidth=2;
      for(let i=0;i<3;i++){
        let r=10+i*8+Math.sin(time*8)*3;
        cx.globalAlpha=0.3-i*0.1;
        cx.beginPath();cx.arc(hookX,hookY,r,0,Math.PI*2);cx.stroke();
      }
      cx.globalAlpha=1;
    }
  }else{
    // Idle rod
    cx.strokeStyle='#8B4513';cx.lineWidth=3;
    cx.beginPath();cx.moveTo(W/2-80,H*0.42);cx.quadraticCurveTo(W/2-60,H*0.36,W/2-40,H*0.35);cx.stroke();
  }
  // Shore
  cx.fillStyle='#2a3a20';
  cx.beginPath();cx.moveTo(0,H*0.48);cx.quadraticCurveTo(W*0.15,H*0.44,W*0.3,H*0.47);
  cx.quadraticCurveTo(W*0.5,H*0.5,W*0.7,H*0.47);cx.quadraticCurveTo(W*0.85,H*0.44,W,H*0.48);
  cx.lineTo(W,H*0.52);cx.lineTo(0,H*0.52);cx.fill();
  // Grass
  cx.strokeStyle='#3a5a25';cx.lineWidth=1.5;
  for(let i=0;i<30;i++){
    let gx=i*(W/28),gy=H*0.47+Math.sin(i)*3;
    let gh=8+Math.sin(time+i)*3;
    cx.beginPath();cx.moveTo(gx,gy);cx.lineTo(gx-2,gy-gh);cx.stroke();
    cx.beginPath();cx.moveTo(gx+4,gy);cx.lineTo(gx+6,gy-gh*0.8);cx.stroke();
  }
}

let lastT=0;
function loop(t){
  let dt=Math.min((t-lastT)/16,3);lastT=t;
  update(dt);draw();
  requestAnimationFrame(loop);
}
init();requestAnimationFrame(loop);
</script>
</body>
</html>
