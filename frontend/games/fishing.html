<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рыбалка — Фаза заброса + Вываживание</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;height:100dvh;background:#5a3a1a;font-family:'Segoe UI',Tahoma,sans-serif;user-select:none;-webkit-user-select:none}
.wrap{display:flex;width:100vw;height:100dvh}
.side{width:70px;background:repeating-linear-gradient(0deg,#8B6914 0px,#A07828 3px,#7A5A10 6px,#9A7020 9px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;flex-shrink:0;border-right:3px solid #5a3a1a}
.side.right{border-right:none;border-left:3px solid #5a3a1a}
.fish-wall{font-size:36px;filter:drop-shadow(2px 3px 3px rgba(0,0,0,.5));animation:sway 3s ease-in-out infinite alternate}
.fish-wall:nth-child(2){animation-delay:-1s}
.fish-wall:nth-child(3){animation-delay:-2s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.hook{font-size:18px;color:#888}
.center{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:linear-gradient(180deg,#4a3010,#3a2508);border-bottom:2px solid #2a1a05;z-index:10;gap:6px;flex-shrink:0}
.tb-item{display:flex;align-items:center;gap:4px;color:#ffd700;font-size:12px;font-weight:700}
.tb-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.coin-bg{background:linear-gradient(135deg,#ffd700,#b8860b);border:2px solid #8B6914}
.bait-bg{background:linear-gradient(135deg,#87ceeb,#4682b4);border:2px solid #2a5a8a}
.tb-plus{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ffd700,#b8860b);border:2px solid #8B6914;color:#3a2508;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.progress-bar{flex:1;max-width:100px;height:14px;background:#2a1a05;border-radius:7px;border:1px solid #8B6914;overflow:hidden;margin:0 6px}
.progress-fill{height:100%;background:linear-gradient(90deg,#4CAF50,#8BC34A);border-radius:7px;transition:width .3s;width:0%}
.level-badge{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8B4513,#5a3010);border:2px solid #8B6914;color:#ffd700;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.settings-btn{font-size:16px;cursor:pointer;color:#ffd700;padding:2px}
.payments-tab{position:absolute;left:0;top:40px;background:linear-gradient(180deg,#e8a020,#c88010);color:#3a2508;padding:6px 3px;border-radius:0 5px 5px 0;font-size:9px;font-weight:700;writing-mode:vertical-lr;z-index:10;cursor:pointer;border:1px solid #8B6914;border-left:none}
.lake-wrap{flex:1;position:relative;overflow:hidden;margin:3px}
canvas#cv{display:block;width:100%;height:100%}
.pull-btn{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#d4c4a0,#b8a888);border:2px solid #8B6914;color:#3a2508;padding:12px 40px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.3);display:none;transition:transform .1s}
.pull-btn:active{transform:translateX(-50%) scale(.95)}
.pull-btn.cast-active{background:linear-gradient(180deg,#ffd700,#b8860b);color:#fff;box-shadow:0 0 20px rgba(255,215,0,.4)}
.pull-btn.fight-active{background:linear-gradient(180deg,#90EE90,#4CAF50);color:#fff}
.bottombar{display:flex;align-items:center;padding:6px 10px;background:linear-gradient(180deg,#3a2508,#2a1a05);border-top:2px solid #4a3010;gap:6px;flex-shrink:0;z-index:10}
.profile{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:44px}
.profile-icon{width:36px;height:36px;border-radius:5px;background:linear-gradient(135deg,#6a5a4a,#4a3a2a);border:2px solid #8B6914;display:flex;align-items:center;justify-content:center;font-size:16px;color:#aaa}
.profile-lvl{font-size:8px;color:#ffd700;font-weight:700}
.profile-pts{font-size:8px;color:#8b7355}
.hunt-btn{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,#1a4a2a,#0a2a1a);border:3px solid #4CAF50;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 12px rgba(76,175,80,.3)}
.hunt-btn:active{transform:scale(.95)}
.hunt-text{color:#4CAF50;font-size:7px;font-weight:700;letter-spacing:1px}
.hunt-icon{font-size:18px}
.inv-slots{display:flex;gap:3px;flex:1;justify-content:center}
.inv-slot{width:44px;height:44px;border-radius:5px;background:linear-gradient(135deg,#5a3a1a,#3a2508);border:2px solid #8B6914;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.inv-slot.empty::after{content:'+';color:#8B6914;font-size:18px;font-weight:700}
.inv-slot .qty{position:absolute;bottom:1px;right:2px;font-size:7px;color:#ffd700;font-weight:700}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(135deg,#3a2a1a,#2a1a0a);border:2px solid #8B6914;border-radius:12px;padding:20px;text-align:center;max-width:280px;width:88%;color:#e8d8c0}
.modal h2{font-size:20px;color:#ffd700;margin-bottom:6px}
.modal .emoji{font-size:42px;margin:6px 0}
.modal .info{font-size:12px;margin:3px 0}
.modal .reward{font-size:14px;color:#ffd700;font-weight:700;margin:6px 0}
.modal button{padding:7px 18px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;margin:3px;background:linear-gradient(135deg,#ffd700,#b8860b);color:#3a2508}
.arrow{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-size:28px;display:none;z-index:5;animation:arrowBounce .6s ease-in-out infinite}
/* Shop modal */
.modal-shop .modal{max-width:340px;width:92%;text-align:left}
.shop-rod{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,215,0,0.15);transition:all .2s}
.shop-rod:hover{border-color:rgba(255,215,0,0.4);background:rgba(255,255,255,0.1)}
.shop-rod.owned{border-color:rgba(80,220,80,0.3)}
.shop-rod.equipped{border-color:#ffd700;background:rgba(255,215,0,0.12)}
.shop-rod-icon{font-size:28px;width:40px;text-align:center}
.shop-rod-info{flex:1;min-width:0}
.shop-rod-name{font-size:13px;font-weight:700;color:#ffd700}
.shop-rod-stats{font-size:10px;color:rgba(255,255,255,0.5);margin-top:2px}
.shop-rod-desc{font-size:10px;color:rgba(255,255,255,0.35);margin-top:1px}
.shop-rod-btn{padding:5px 14px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.shop-rod-btn:hover{transform:translateY(-1px)}
.shop-rod-btn.buy{background:linear-gradient(135deg,#ffd700,#b8860b);color:#3a2508}
.shop-rod-btn.buy:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.shop-rod-btn.equip{background:rgba(80,220,80,0.3);color:#4CAF50;border:1px solid #4CAF50}
.shop-rod-btn.equipped{background:rgba(255,215,0,0.2);color:#ffd700;border:1px solid #ffd700;cursor:default}
.shop-coins{text-align:center;font-size:11px;color:rgba(255,255,255,0.5);padding:8px 0}
@keyframes arrowBounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}
.cast-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:#ffd700;font-size:13px;font-weight:700;display:none;z-index:5;text-shadow:0 2px 4px rgba(0,0,0,.7);background:rgba(0,0,0,.4);padding:4px 14px;border-radius:8px;border:1px solid #8B6914;white-space:nowrap}
.cast-hint.perfect{color:#4CAF50;border-color:#4CAF50;background:rgba(30,80,30,.5)}
.cast-hint.good{color:#ffd700;border-color:#ffd700}
.cast-hint.bad{color:#ff4444;border-color:#ff4444}
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <div class="hook">🪝</div><div class="fish-wall">🐟</div><div class="fish-wall">🐠</div><div class="fish-wall">🐡</div><div class="hook">🪝</div>
  </div>
  <div class="center">
    <div class="topbar">
      <div class="tb-item"><div class="tb-icon coin-bg">🪙</div><span id="coins">292</span></div>
      <div class="tb-item"><div class="tb-icon bait-bg">🪱</div><span id="bait">100</span></div>
      <div class="tb-plus" onclick="buyBait()">+</div>
      <div class="progress-bar"><div class="progress-fill" id="pf"></div></div>
      <div class="level-badge" id="lvl">1</div>
      <div class="tb-item" style="cursor:pointer;gap:2px" onclick="openShop()" title="Магазин удочек">
        <span class="rod-indicator" id="rodIcon">🥢</span>
        <span style="font-size:9px;opacity:0.6" id="rodLvl">-</span>
      </div>
      <div class="tb-item" style="cursor:pointer" onclick="openShop()" title="Магазин">🛒</div>
    </div>
    <div class="payments-tab">Платежи</div>
    <div class="lake-wrap">
      <canvas id="cv"></canvas>
      <div class="cast-hint" id="castHint"></div>
      <div class="arrow" id="arrow">⬇️</div>
      <button class="pull-btn" id="pullBtn">Заброс</button>
    </div>
    <div class="bottombar">
      <div class="profile">
        <div class="profile-icon">👤</div>
        <div class="profile-lvl">Ур. <span id="plvl">1</span></div>
        <div class="profile-pts"><span id="ppts">0</span> оч.</div>
      </div>
      <div class="hunt-btn" onclick="startCharging()">
        <div class="hunt-icon">🎣</div>
        <div class="hunt-text">HUNT</div>
      </div>
      <div class="inv-slots" id="invSlots"></div>
    </div>
  </div>
  <div class="side right">
    <div class="hook">🪝</div><div class="fish-wall" style="animation-delay:-.5s">🐟</div><div class="fish-wall" style="animation-delay:-1.5s">🐠</div><div class="fish-wall" style="animation-delay:-2.5s">🐡</div><div class="hook">🪝</div>
  </div>
</div>
<div class="modal-bg" id="modal"><div class="modal" id="modalInner"></div></div>
<div class="modal-bg modal-shop" id="shopModal"><div class="modal" id="shopBody"></div></div>

<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
let W,H,dpr;
function resize(){
  dpr=window.devicePixelRatio||1;
  let r=cv.parentElement.getBoundingClientRect();
  W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
}
resize();window.addEventListener('resize',resize);

// ===== State =====
let coins=parseInt(localStorage.getItem('fc')||'292');
let bait=parseInt(localStorage.getItem('fb')||'100');
let lvl=parseInt(localStorage.getItem('fl')||'1');
let xp=parseInt(localStorage.getItem('fxp')||'0');
let caught=JSON.parse(localStorage.getItem('fca')||'[]');
let inv=JSON.parse(localStorage.getItem('finv')||'[null,null,null,null,null,null,null]');
// Rod shop
let rodIndex=parseInt(localStorage.getItem('frod')||'0'); // equipped rod
let ownedRods=JSON.parse(localStorage.getItem('fown')||'[true,false,false,false]');
// states: idle, charging, casting, waiting, bite, fighting, caught
let state='idle';
let time=0;
let lineX=0,lineY=0,hookX=0,hookY=0,targetX=0,targetY=0;
let biteTimer=0,biteFish=null;
let bubbles=[],ripples=[],clouds=[];
let fishes=[];
let pulling=false;

// ===== Phase 1: Power Bar (Casting) =====
let powerPos=0.5;    // 0..1 position of indicator on the power bar
let powerDir=1;      // direction of movement
let powerSpeed=0.005; // speed of indicator (~3.3s per direction at lvl1)
let castQuality='';  // 'perfect', 'good', 'bad'
let castBonus=false; // perfect cast bonus

// ===== Phase 2: Tension Bar (Fighting) =====
let tension=50;      // 0..100 — center 50 is safe
let tensionDir=1;    // direction fish is pulling
let fishStrength=1;  // how hard fish fights
let catchProg=0;     // 0..100 catch progress
let struggleTimer=0; // frames until next struggle burst
let inStruggle=false;// fish doing a burst
const SAFE_ZONE_LOW=33;
const SAFE_ZONE_HIGH=67;

const FISH=[
  {name:'Карась',emoji:'🐟',wt:[0.2,1.5],col:'#c0a040',val:10,bite:0.3,xp:5,str:0.5,speed:1.0},
  {name:'Окунь',emoji:'🐠',wt:[0.3,2],col:'#4a8a3a',val:15,bite:0.25,xp:8,str:0.7,speed:1.4},
  {name:'Лещ',emoji:'🐡',wt:[0.4,2.5],col:'#8a7a50',val:20,bite:0.35,xp:7,str:0.4,speed:0.8},
  {name:'Щука',emoji:'🐟',wt:[0.5,4],col:'#5a6a3a',val:25,bite:0.2,xp:12,str:0.9,speed:1.8},
  {name:'Судак',emoji:'🐠',wt:[0.8,3.5],col:'#7a8a6a',val:35,bite:0.18,xp:15,str:1.1,speed:2.0},
  {name:'Сом',emoji:'🐟',wt:[1,6],col:'#3a3a3a',val:40,bite:0.15,xp:20,str:1.3,speed:2.2},
  {name:'Золотая',emoji:'✨',wt:[0.1,0.5],col:'#ffd700',val:100,bite:0.05,xp:50,str:1.6,speed:2.8},
];

// ===== Rods =====
const RODS=[
  {name:'Деревянная',emoji:'🥢',speedMult:0.75,coinMult:1.0,price:0,desc:'Медленный индикатор, без бонуса'},
  {name:'Стеклопластик',emoji:'🎋',speedMult:1.0,coinMult:1.2,price:300,desc:'Стандартная скорость, +20% монет'},
  {name:'Карбон',emoji:'🎣',speedMult:1.35,coinMult:1.6,price:800,desc:'Быстрый индикатор, +60% монет'},
  {name:'Титан PRO',emoji:'⚡',speedMult:1.75,coinMult:2.5,price:2000,desc:'Экстрим-скорость, +150% монет!'},
];

// ===== Init =====
function init(){
  for(let i=0;i<4;i++)clouds.push({x:Math.random()*W,y:10+Math.random()*25,w:30+Math.random()*60,h:8+Math.random()*12,s:0.1+Math.random()*0.15});
  for(let i=0;i<5;i++)spawnFish();
  updateUI();buildInv();
}

function spawnFish(){
  let f=FISH[Math.floor(Math.random()*FISH.length)];
  let side=Math.random()>0.5?1:-1;
  fishes.push({type:f,x:side>0?W+40:-40,y:H*0.3+Math.random()*H*0.45,vx:side*-(0.2+f.speed*0.25),sz:14+f.wt[0]*5,col:f.col,w:Math.random()*Math.PI*2,dir:side,alive:true});
}

function updateUI(){
  document.getElementById('coins').textContent=coins;
  document.getElementById('bait').textContent=bait;
  document.getElementById('lvl').textContent=lvl;
  document.getElementById('ppts').textContent=xp;
  document.getElementById('plvl').textContent=lvl;
  document.getElementById('pf').style.width=Math.min(100,xp/(lvl*100)*100)+'%';
  updateRodDisplay();
}

function updateRodDisplay(){
  let r=RODS[rodIndex];
  document.getElementById('rodIcon').textContent=r.emoji;
  document.getElementById('rodLvl').textContent=r.name;
}

function buildInv(){
  let el=document.getElementById('invSlots');el.innerHTML='';
  for(let i=0;i<7;i++){
    let s=document.createElement('div');s.className='inv-slot'+(inv[i]?' filled':' empty');
    if(inv[i]){let f=FISH.find(x=>x.name===inv[i].name);s.innerHTML=(f?f.emoji:'🐟')+(inv[i].qty>1?`<span class=\"qty\">x${inv[i].qty}</span>`:'');}
    el.appendChild(s);
  }
}

function addToInv(fish,weight){
  for(let i=0;i<inv.length;i++){if(inv[i]&&inv[i].name===fish.name){inv[i].qty++;save();buildInv();return;}}
  for(let i=0;i<inv.length;i++){if(!inv[i]){inv[i]={name:fish.name,weight:parseFloat(weight),qty:1};save();buildInv();return;}}
}

function save(){
  localStorage.setItem('fc',coins);localStorage.setItem('fb',bait);
  localStorage.setItem('fl',lvl);localStorage.setItem('fxp',xp);
  localStorage.setItem('fca',JSON.stringify(caught));localStorage.setItem('finv',JSON.stringify(inv));
  localStorage.setItem('frod',rodIndex);localStorage.setItem('fown',JSON.stringify(ownedRods));
}
function buyBait(){if(coins>=10){coins-=10;bait+=10;save();updateUI();}}

// ===== PHASE 1: POWER BAR (CHARGING) =====
function startCharging(){
  if(state!=='idle')return;
  if(bait<=0){showMsg('Нет наживки!','Купить 10 за 10🪙?',()=>{if(coins>=10){coins-=10;bait+=10;save();updateUI();}});return;}
  bait--;save();updateUI();
  state='charging';
  powerPos=0.5;
  powerDir=1;
  // Speed depends on level (higher level = slower = easier)
  // Speed: higher level = faster (harder). Base 0.005 (+0.0002 per lvl, max 0.012)
  powerSpeed=Math.min(0.012,0.005+(lvl-1)*0.0002)*RODS[rodIndex].speedMult;
  castQuality='';
  castBonus=false;
  document.getElementById('pullBtn').style.display='block';
  document.getElementById('pullBtn').textContent='⬆ ЗАБРОС ⬆';
  document.getElementById('pullBtn').className='pull-btn cast-active';
  document.getElementById('pullBtn').onclick=doCast;
  document.getElementById('arrow').style.display='none';
  document.getElementById('castHint').style.display='none';
}

function doCast(){
  if(state!=='charging')return;
  // Determine cast quality based on powerPos
  // Perfect zone: 0.35..0.65 (center 30%)
  // Good zone: 0.2..0.35 or 0.65..0.8
  // Bad zone: 0..0.2 or 0.8..1.0
  if(powerPos>=0.35&&powerPos<=0.65){
    castQuality='perfect';
    castBonus=true;
  }else if((powerPos>=0.2&&powerPos<0.35)||(powerPos>0.65&&powerPos<=0.8)){
    castQuality='good';
    castBonus=false;
  }else{
    castQuality='bad';
    castBonus=false;
  }
  // Show hint briefly
  let hint=document.getElementById('castHint');
  hint.style.display='block';
  if(castQuality==='perfect'){hint.textContent='✨ ИДЕАЛЬНЫЙ ЗАБРОС! +шанс редкой рыбы';hint.className='cast-hint perfect';}
  else if(castQuality==='good'){hint.textContent='✓ Хороший заброс';hint.className='cast-hint good';}
  else{hint.textContent='✗ Слабый заброс';hint.className='cast-hint bad';}
  setTimeout(()=>{hint.style.display='none';},1200);

  // Cast the line
  state='casting';
  lineX=W*0.6;lineY=H*0.1;
  targetX=W*0.15+Math.random()*W*0.5;
  targetY=H*0.25+Math.random()*H*0.4;
  hookX=lineX;hookY=lineY;
  document.getElementById('pullBtn').style.display='none';
  document.getElementById('pullBtn').onclick=null;
}

// ===== PHASE 2: TENSION BAR (FIGHTING) =====
function startFight(){
  state='fighting';
  pulling=false;
  tension=50;
  catchProg=0;
  fishStrength=biteFish.type.str;
  struggleTimer=100+Math.floor(Math.random()*200); // first burst in 1.7-5s
  inStruggle=false;
  // Random initial pull direction
  tensionDir=Math.random()>0.5?1:-1;
  document.getElementById('pullBtn').style.display='block';
  document.getElementById('pullBtn').textContent='💪 ТЯНУТЬ (⚠️ ОПАСНО!)';
  document.getElementById('pullBtn').className='pull-btn fight-active';
  document.getElementById('pullBtn').onmousedown=startPull;
  document.getElementById('pullBtn').onmouseup=stopPull;
  document.getElementById('pullBtn').onmouseleave=stopPull;
  document.getElementById('pullBtn').ontouchstart=startPull;
  document.getElementById('pullBtn').ontouchend=stopPull;
  document.getElementById('arrow').style.display='none';
  ripples.push({x:hookX,y:hookY,r:8,life:1});
}

function startPull(){
  if(state==='bite'){startFight();return;}
  if(state==='fighting')pulling=true;
}
function stopPull(){if(state==='fighting')pulling=false;}

// ===== UPDATE =====
function update(dt){
  time+=dt;
  clouds.forEach(c=>{c.x+=c.s;if(c.x>W+80)c.x=-80;});
  fishes.forEach(f=>{if(!f.alive)return;f.x+=f.vx;f.w+=dt*2;f.y+=Math.sin(f.w)*0.3;});
  fishes=fishes.filter(f=>f.alive&&(f.x>-60&&f.x<W+60));
  while(fishes.length<5)spawnFish();
  if(Math.random()<0.03)bubbles.push({x:Math.random()*W,y:H*0.3+Math.random()*H*0.4,r:1+Math.random()*2,vy:-0.15-Math.random()*0.2,life:1});
  bubbles.forEach(b=>{b.y+=b.vy;b.life-=0.008;});bubbles=bubbles.filter(b=>b.life>0);
  ripples.forEach(r=>{r.r+=0.3;r.life-=0.012;});ripples=ripples.filter(r=>r.life>0);

  // === PHASE 1: Power Bar charging ===
  if(state==='charging'){
    powerPos+=powerDir*powerSpeed;
    if(powerPos>=1){powerPos=1;powerDir=-1;}
    if(powerPos<=0){powerPos=0;powerDir=1;}
  }

  // === Casting (line flies out) ===
  if(state==='casting'){
    let dx=targetX-hookX,dy=targetY-hookY,d=Math.hypot(dx,dy);
    if(d<5){
      hookX=targetX;hookY=targetY;
      state='waiting';
      ripples.push({x:hookX,y:hookY,r:5,life:1});
      biteTimer=80+Math.random()*150;
    }else{
      hookX+=dx*0.12;hookY+=dy*0.12;
    }
  }

  // === Waiting for bite ===
  if(state==='waiting'){
    hookY+=Math.sin(time*1.5)*0.12;
    biteTimer--;
    if(biteTimer<=0){
      let near=null,minD=Infinity;
      fishes.forEach(f=>{
        if(!f.alive)return;
        let d=Math.hypot(f.x-hookX,f.y-hookY);
        // Perfect cast = higher bite chance
        let biteChance=castBonus?f.type.bite*1.5:f.type.bite;
        if(d<80&&d<minD&&Math.random()<biteChance){minD=d;near=f;}
      });
      if(near){
        state='bite';biteFish=near;biteTimer=120;
        document.getElementById('arrow').style.display='block';
        document.getElementById('arrow').style.left=hookX+'px';
        document.getElementById('pullBtn').style.display='block';
        document.getElementById('pullBtn').textContent='🎣 КЛЮЁТ!';
        document.getElementById('pullBtn').className='pull-btn';
        document.getElementById('pullBtn').onmousedown=startPull;
        document.getElementById('pullBtn').onmouseup=stopPull;
        document.getElementById('pullBtn').onmouseleave=stopPull;
        document.getElementById('pullBtn').ontouchstart=startPull;
        document.getElementById('pullBtn').ontouchend=stopPull;
      }else biteTimer=60+Math.random()*120;
    }
  }

  // === Bite window ===
  if(state==='bite'){
    hookY+=Math.sin(time*10)*2;
    biteTimer--;
    if(biteTimer<=0){
      state='idle';biteFish=null;
      hideFightUI();
    }
  }

  // === PHASE 2: Fighting (Tension Bar) ===
  if(state==='fighting'){
    // Fish pulls tension in its direction (hard: ~3-8/sec, scales with lvl)
    let lvlScale=1+Math.log(lvl)*0.35; // fish scales logarithmically (slower growth at high levels)
    let basePull=fishStrength*(0.025+Math.random()*0.025)*lvlScale;
    let pullMult=inStruggle?3:1;
    let fishPull=basePull*pullMult;
    tension+=tensionDir*fishPull;

    // Struggle burst timer
    struggleTimer--;
    if(struggleTimer<=0&&!inStruggle){
      inStruggle=true;
      struggleTimer=20+Math.floor(Math.random()*30); // burst lasts 0.3-0.5s
    }
    if(inStruggle){
      struggleTimer--;
      if(struggleTimer<=0){
        inStruggle=false;
        struggleTimer=200+Math.floor(Math.random()*300); // next burst in 3-8s
      }
    }

    // Fish randomly changes direction (rare: ~every 8-20s, longer commitment)
    if(Math.random()<0.0015*fishStrength){
      tensionDir*=-1;
    }

    // Bounce off edges
    if(tension<=0){tension=0;tensionDir=1;}
    if(tension>=100){tension=100;tensionDir=-1;}

    // ⚡ ИНВЕРТИРОВАНО: зажатие толкает натяжение к КРАСНОЙ ЗОНЕ (опасно!)
    if(pulling){
      let playerPull=0.08*(1+lvl*0.015);
      let pullDir=tension>50?1:-1; // ТОЛКАЕМ К КРАЮ!
      tension+=pullDir*playerPull;
    }

    // Очень слабый дрейф к центру (едва заметный)
    if(!pulling){
      if(tension>50)tension=Math.max(50,tension-0.005);
      else tension=Math.min(50,tension+0.005);
    }

    // Clamp
    tension=Math.max(0,Math.min(100,tension));

    // Прогресс вылова: БЫСТРЕЕ при зажатии (риск), МЕДЛЕННЕЕ при отпускании
    if(tension>=SAFE_ZONE_LOW&&tension<=SAFE_ZONE_HIGH){
      catchProg+=(pulling?0.06:0.02)*(1+lvl*0.01);
    }
    // Потеря прогресса в опасной зоне
    if(tension<SAFE_ZONE_LOW||tension>SAFE_ZONE_HIGH){
      catchProg=Math.max(0,catchProg-0.05);
    }

    catchProg=Math.min(100,catchProg);

    // Visual red flash when in danger zone
    if(tension<SAFE_ZONE_LOW||tension>SAFE_ZONE_HIGH){
      cx.fillStyle='rgba(255,0,0,'+(Math.abs(tension-50)*0.003)+')';
      cx.fillRect(0,0,W,H);
    }

    // Line snaps if too far out of safe zone
    if(tension<=10||tension>=90){
      state='idle';biteFish=null;
      hideFightUI();
      showMsg('Обрыв!','Рыба ушла...',()=>{});
      return;
    }

    // Catch complete!
    if(catchProg>=100){
      state='caught';
      hideFightUI();
      showCatch();
      return;
    }

    // Rod animation
    hookY=H*0.15+Math.sin(time*5)*5*(pulling?4:1);
    hookX=W*0.55+(tension-50)*0.8;
  }
}

function hideFightUI(){
  document.getElementById('pullBtn').style.display='none';
  document.getElementById('pullBtn').className='pull-btn';
  document.getElementById('pullBtn').onmousedown=null;
  document.getElementById('pullBtn').onmouseup=null;
  document.getElementById('pullBtn').onmouseleave=null;
  document.getElementById('arrow').style.display='none';
}

// ===== CATCH RESULT =====
function showCatch(){
  let f=biteFish.type;
  let w=(f.wt[0]+Math.random()*(f.wt[1]-f.wt[0])).toFixed(1);
  let rodMult=RODS[rodIndex].coinMult;
  let earned=Math.floor((f.val+Math.floor(w*10))*rodMult);
  coins+=earned;xp+=f.xp;
  if(xp>=lvl*100){xp-=lvl*100;lvl++;}
  caught.push({name:f.name,weight:w});
  addToInv(f,w);save();updateUI();
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalInner').innerHTML=
    `<div class="emoji">${f.emoji}</div><h2>${f.name}</h2>
     <div class="info">Вес: ${w} кг</div>
     <div class="info">Качество заброса: ${castQuality==='perfect'?'✨ Идеальный':castQuality==='good'?'✓ Хороший':'✗ Обычный'}</div>
     <div class="reward">+${earned} 🪙  +${f.xp} XP</div>
     <button onclick="closeModal()">ОК</button>`;
  biteFish.alive=false;biteFish=null;
}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('shopModal').classList.remove('show');}

// ===== ROD SHOP =====
function openShop(){
  if(state!=='idle')return;
  let el=document.getElementById('shopModal');
  el.classList.add('show');
  renderShop();
}
// Close shop on backdrop click
document.getElementById('shopModal').onclick=function(e){if(e.target===this)closeModal();};

function renderShop(){
  let html='';
  for(let i=0;i<RODS.length;i++){
    let r=RODS[i];
    let owned=ownedRods[i];
    let equipped=i===rodIndex;
    let canBuy=!owned&&coins>=r.price;
    let cls='shop-rod'+(owned?' owned':'')+(equipped?' equipped':'');
    let btn='';
    if(!owned){
      if(r.price===0) btn=`<button class="shop-rod-btn equip" onclick="equipRod(${i})">Бесплатно</button>`;
      else btn=`<button class="shop-rod-btn buy" ${canBuy?'':`disabled`} onclick="buyRod(${i})">${r.price}🪙</button>`;
    }else if(equipped){
      btn=`<button class="shop-rod-btn equipped">✓ Экипировано</button>`;
    }else{
      btn=`<button class="shop-rod-btn equip" onclick="equipRod(${i})">Надеть</button>`;
    }
    html+=`<div class="${cls}">
      <div class="shop-rod-icon">${r.emoji}</div>
      <div class="shop-rod-info">
        <div class="shop-rod-name">${r.name}</div>
        <div class="shop-rod-stats">⚡x${r.speedMult.toFixed(2)} скорость · 🪙x${r.coinMult.toFixed(1)} монет</div>
        <div class="shop-rod-desc">${r.desc}</div>
      </div>
      ${btn}
    </div>`;
  }
  html+=`<div class="shop-coins">У вас 🪙 ${coins} монет</div>`;
  document.getElementById('shopBody').innerHTML=html;
}

function buyRod(i){
  if(ownedRods[i])return;
  let r=RODS[i];
  if(coins<r.price)return;
  coins-=r.price;
  ownedRods[i]=true;
  rodIndex=i;
  save();updateUI();
  renderShop();
}

function equipRod(i){
  if(!ownedRods[i])return;
  rodIndex=i;
  save();updateUI();
  renderShop();
}

function showMsg(t,txt,fn){document.getElementById('modal').classList.add('show');
  document.getElementById('modalInner').innerHTML=
    `<h2>${t}</h2><div class="info">${txt}</div><button onclick="closeModal();${fn?fn.name+'()':''}">ОК</button>`;
}

// ===== DRAW =====
function draw(){
  cx.clearRect(0,0,W,H);
  // Sky
  let sky=cx.createLinearGradient(0,0,0,H*0.5);
  sky.addColorStop(0,'#4a90d9');sky.addColorStop(0.3,'#87CEEB');sky.addColorStop(0.6,'#B0E0E6');sky.addColorStop(1,'#5A8A50');
  cx.fillStyle=sky;cx.fillRect(0,0,W,H*0.5);
  // Clouds
  cx.fillStyle='rgba(255,255,255,0.8)';
  clouds.forEach(c=>{cx.beginPath();cx.ellipse(c.x,c.y,c.w/2,c.h/2,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(c.x-c.w*0.3,c.y+3,c.w*0.25,c.h*0.35,0,0,Math.PI*2);cx.fill();});
  // Mountains
  cx.fillStyle='#5a8a4a';
  cx.beginPath();cx.moveTo(0,H*0.48);cx.lineTo(W*0.15,H*0.35);cx.lineTo(W*0.3,H*0.42);cx.lineTo(W*0.5,H*0.32);cx.lineTo(W*0.7,H*0.4);cx.lineTo(W*0.85,H*0.34);cx.lineTo(W,H*0.45);cx.lineTo(W,H*0.5);cx.lineTo(0,H*0.5);cx.fill();
  // Trees
  cx.fillStyle='#3a6a2a';
  for(let i=0;i<20;i++){let tx=i*(W/18)-15,ty=H*0.47+Math.sin(i*1.7)*5,th=20+Math.sin(i*2.3)*12;cx.beginPath();cx.moveTo(tx,ty);cx.lineTo(tx+5,ty-th);cx.lineTo(tx+10,ty);cx.fill();}
  // Water
  let waterH=H*0.48;
  let water=cx.createLinearGradient(0,waterH,0,H);
  water.addColorStop(0,'#3a7aaa');water.addColorStop(0.1,'#2a6a9a');water.addColorStop(0.4,'#1a5a8a');water.addColorStop(0.7,'#0a3a6a');water.addColorStop(1,'#052040');
  cx.fillStyle=water;cx.fillRect(0,waterH,W,H-waterH);
  // Water surface waves
  cx.strokeStyle='rgba(255,255,255,0.12)';cx.lineWidth=1;
  for(let i=0;i<4;i++){cx.beginPath();for(let x=0;x<W;x+=3){let y=waterH+i*5+Math.sin(x*0.025+time*0.7+i)*2.5;x===0?cx.moveTo(x,y):cx.lineTo(x,y);}cx.stroke();}
  // Water shimmer
  for(let i=0;i<12;i++){let sx=(i*79+time*6)%W;let sy=waterH+8+Math.sin(time*0.4+i)*12+i*10;cx.fillStyle=`rgba(255,255,255,${0.03+Math.sin(time+i)*0.02})`;cx.fillRect(sx,sy,15+Math.sin(time+i)*6,1);}
  // Fish underwater
  fishes.forEach(f=>{if(!f.alive)return;cx.save();cx.translate(f.x,f.y);if(f.dir<0)cx.scale(-1,1);cx.fillStyle=f.col;cx.beginPath();cx.ellipse(0,0,f.sz,f.sz*0.3,0,0,Math.PI*2);cx.fill();cx.fillStyle=f.col+'aa';cx.beginPath();cx.moveTo(-f.sz*0.25,-f.sz*0.2);cx.lineTo(-f.sz*0.08,-f.sz*0.4);cx.lineTo(f.sz*0.08,-f.sz*0.2);cx.fill();cx.beginPath();cx.moveTo(-f.sz,0);cx.lineTo(-f.sz*1.15,-f.sz*0.2);cx.lineTo(-f.sz*1.15,f.sz*0.2);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(f.sz*0.4,-f.sz*0.06,f.sz*0.08,0,Math.PI*2);cx.fill();cx.fillStyle='#000';cx.beginPath();cx.arc(f.sz*0.44,-f.sz*0.06,f.sz*0.04,0,Math.PI*2);cx.fill();cx.restore();});
  // Bubbles
  bubbles.forEach(b=>{cx.strokeStyle=`rgba(200,240,255,${b.life*0.35})`;cx.lineWidth=0.5;cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.stroke();});
  // Ripples
  ripples.forEach(r=>{cx.strokeStyle=`rgba(200,240,255,${r.life*0.35})`;cx.lineWidth=0.8;cx.beginPath();cx.ellipse(r.x,r.y,r.r,r.r*0.25,0,0,Math.PI*2);cx.stroke();});
  // Fishing rod
  let rodTipX=W*0.62,rodTipY=H*0.08;
  let rodBaseX=W*0.72,rodBaseY=H*0.52;
  cx.strokeStyle='#8B6914';cx.lineWidth=4;cx.beginPath();cx.moveTo(rodBaseX,rodBaseY);cx.quadraticCurveTo(W*0.68,H*0.25,rodTipX,rodTipY);cx.stroke();
  cx.strokeStyle='#A07828';cx.lineWidth=2;cx.beginPath();cx.moveTo(rodBaseX,rodBaseY);cx.quadraticCurveTo(W*0.68,H*0.25,rodTipX,rodTipY);cx.stroke();
  // Rod tip bend when fighting
  let bendX=state==='fighting'?hookX:rodTipX;
  let bendY=state==='fighting'?Math.min(rodTipY+20,hookY-10):rodTipY;
  if(state==='fighting'){
    cx.strokeStyle='#8B6914';cx.lineWidth=3;
    cx.beginPath();cx.moveTo(rodTipX,rodTipY);cx.lineTo(bendX,bendY);cx.stroke();
  }
  // Line
  if(state!=='idle'&&state!=='charging'){
    let fromX=state==='fighting'?bendX:rodTipX;
    let fromY=state==='fighting'?bendY:rodTipY;
    cx.strokeStyle='rgba(200,200,200,0.45)';cx.lineWidth=0.7;
    cx.beginPath();cx.moveTo(fromX,fromY);
    let midX=(fromX+hookX)/2,midY=Math.min(fromY,hookY)-10;
    cx.quadraticCurveTo(midX,midY,hookX,hookY);cx.stroke();
    // Hook
    cx.strokeStyle='#ccc';cx.lineWidth=1.5;cx.beginPath();cx.arc(hookX,hookY+3,3,0,Math.PI);cx.stroke();cx.beginPath();cx.moveTo(hookX,hookY+3);cx.lineTo(hookX+2,hookY);cx.stroke();
    // Bobber
    if(state!=='fighting'){
      cx.fillStyle='#ff3333';cx.beginPath();cx.arc(hookX,hookY-2,3,0,Math.PI*2);cx.fill();
      cx.fillStyle='#fff';cx.beginPath();cx.arc(hookX,hookY-2,1.2,0,Math.PI*2);cx.fill();
    }
  }
  // Bite ripples
  if(state==='bite'){
    cx.strokeStyle='rgba(255,200,0,0.5)';cx.lineWidth=1.5;
    for(let i=0;i<3;i++){let r=6+i*5+Math.sin(time*10)*2;cx.globalAlpha=0.35-i*0.1;cx.beginPath();cx.arc(hookX,hookY,r,0,Math.PI*2);cx.stroke();}
    cx.globalAlpha=1;
  }
  // Shore
  cx.fillStyle='#5a4a30';cx.beginPath();cx.moveTo(0,waterH+4);cx.quadraticCurveTo(W*0.3,waterH-3,W*0.5,waterH+2);cx.quadraticCurveTo(W*0.7,waterH+8,W,waterH+4);cx.lineTo(W,waterH+12);cx.lineTo(0,waterH+12);cx.fill();

  // ===== PHASE 1 UI: Power Bar =====
  if(state==='charging')drawPowerBar();

  // ===== PHASE 2 UI: Tension Bar & Catch Bar =====
  if(state==='fighting')drawFightBars();
}

// ===== POWER BAR (Casting Phase) =====
function drawPowerBar(){
  let barX=W*0.08,barW=28;
  let barY=H*0.18,barH=H*0.5;
  let cx2=cx;

  // Background
  cx2.fillStyle='rgba(0,0,0,0.6)';
  cx2.beginPath();cx2.roundRect(barX-4,barY-4,barW+8,barH+8,6);cx2.fill();

  // Gradient zones: red/yellow/green/yellow/red
  // Perfect zone: center 30%: from 0.35 to 0.65 of bar height
  let pLow=0.35,pHigh=0.65;

  // Red bottom (0..0.2)
  cx2.fillStyle='rgba(255,60,60,0.5)';
  cx2.fillRect(barX,barY+barH*(1-0.2),barW,barH*0.2);
  // Yellow bottom (0.2..0.35)
  cx2.fillStyle='rgba(255,200,0,0.5)';
  cx2.fillRect(barX,barY+barH*(1-0.35),barW,barH*(0.35-0.2));
  // Green perfect (0.35..0.65)
  cx2.fillStyle='rgba(80,220,80,0.6)';
  cx2.fillRect(barX,barY+barH*(1-0.65),barW,barH*(0.65-0.35));
  // Yellow top (0.65..0.8)
  cx2.fillStyle='rgba(255,200,0,0.5)';
  cx2.fillRect(barX,barY+barH*(1-0.8),barW,barH*(0.8-0.65));
  // Red top (0.8..1.0)
  cx2.fillStyle='rgba(255,60,60,0.5)';
  cx2.fillRect(barX,barY,barW,barH*0.2);

  // Border
  cx2.strokeStyle='#8B6914';cx2.lineWidth=2;
  cx2.beginPath();cx2.roundRect(barX,barY,barW,barH,4);cx2.stroke();

  // Indicator position (powerPos 0=bottom, 1=top)
  let indY=barY+barH*(1-powerPos);
  // Glow
  let grad=cx2.createRadialGradient(barX+barW/2,indY,0,barX+barW/2,indY,18);
  grad.addColorStop(0,'rgba(255,215,0,0.6)');grad.addColorStop(1,'rgba(255,215,0,0)');
  cx2.fillStyle=grad;cx2.beginPath();cx2.arc(barX+barW/2,indY,18,0,Math.PI*2);cx2.fill();
  // Indicator dot
  cx2.fillStyle='#ffd700';cx2.shadowColor='#ffd700';cx2.shadowBlur=12;
  cx2.beginPath();cx2.arc(barX+barW/2,indY,6,0,Math.PI*2);cx2.fill();
  cx2.shadowBlur=0;
  cx2.strokeStyle='#fff';cx2.lineWidth=1.5;
  cx2.beginPath();cx2.arc(barX+barW/2,indY,6,0,Math.PI*2);cx2.stroke();

  // Perfect zone markers
  let pY1=barY+barH*(1-0.65),pY2=barY+barH*(1-0.35);
  cx2.strokeStyle='rgba(80,220,80,0.8)';cx2.lineWidth=1;cx2.setLineDash([3,3]);
  cx2.beginPath();cx2.moveTo(barX-2,pY1);cx2.lineTo(barX+barW+2,pY1);cx2.stroke();
  cx2.beginPath();cx2.moveTo(barX-2,pY2);cx2.lineTo(barX+barW+2,pY2);cx2.stroke();
  cx2.setLineDash([]);

  // Label
  cx2.fillStyle='#ffd700';cx2.font='bold 10px sans-serif';cx2.textAlign='center';
  cx2.fillText('СИЛА',barX+barW/2,barY-8);
  cx2.fillStyle='rgba(80,220,80,0.6)';cx2.font='7px sans-serif';
  cx2.fillText('ИДЕАЛ',barX+barW/2,barY+barH*(1-0.5)-2);

  // Arrow on the side
  let arrowDir=powerDir>0?'▲':'▼';
  cx2.fillStyle='#ffd700';cx2.font='16px sans-serif';cx2.textAlign='left';
  cx2.fillText(arrowDir,barX+barW+6,indY+5);
}

// ===== TENSION BAR & CATCH BAR (Fighting Phase) =====
function drawFightBars(){
  let cx2=cx;
  let barW=Math.min(280,W-40),barH=16;
  let barX=(W-barW)/2,barY=14;

  // === Tension Bar ===
  // Background
  cx2.fillStyle='rgba(0,0,0,0.7)';
  cx2.beginPath();cx2.roundRect(barX-3,barY-3,barW+6,barH+6,8);cx2.fill();

  // Danger zones (red)
  let safeLow=(SAFE_ZONE_LOW/100)*barW;
  let safeHigh=(SAFE_ZONE_HIGH/100)*barW;
  // Left danger
  cx2.fillStyle='rgba(255,40,40,0.5)';
  cx2.fillRect(barX,barY,safeLow,barH);
  // Right danger
  cx2.fillStyle='rgba(255,40,40,0.5)';
  cx2.fillRect(barX+safeHigh,barY,barW-safeHigh,barH);
  // Safe zone (green center)
  cx2.fillStyle='rgba(60,220,60,0.5)';
  cx2.fillRect(barX+safeLow,barY,safeHigh-safeLow,barH);

  // Border
  cx2.strokeStyle='#8B6914';cx2.lineWidth=1.5;
  cx2.beginPath();cx2.roundRect(barX,barY,barW,barH,5);cx2.stroke();

  // Separation lines for safe zone
  cx2.strokeStyle='rgba(255,255,255,0.3)';cx2.lineWidth=1;cx2.setLineDash([2,3]);
  cx2.beginPath();cx2.moveTo(barX+safeLow,barY);cx2.lineTo(barX+safeLow,barY+barH);cx2.stroke();
  cx2.beginPath();cx2.moveTo(barX+safeHigh,barY);cx2.lineTo(barX+safeHigh,barY+barH);cx2.stroke();
  cx2.setLineDash([]);

  // Tension indicator (diamond)
  let tX=barX+(tension/100)*barW;
  let tY=barY+barH/2;
  let inSafe=tension>=SAFE_ZONE_LOW&&tension<=SAFE_ZONE_HIGH;
  cx2.fillStyle=inSafe?'#44ff44':'#ff4444';
  cx2.shadowColor=inSafe?'#44ff44':'#ff4444';
  cx2.shadowBlur=10;
  cx2.beginPath();
  cx2.moveTo(tX,tY-9);cx2.lineTo(tX+6,tY);
  cx2.lineTo(tX,tY+9);cx2.lineTo(tX-6,tY);
  cx2.closePath();cx2.fill();
  cx2.shadowBlur=0;
  cx2.strokeStyle='#fff';cx2.lineWidth=1;
  cx2.beginPath();
  cx2.moveTo(tX,tY-9);cx2.lineTo(tX+6,tY);
  cx2.lineTo(tX,tY+9);cx2.lineTo(tX-6,tY);
  cx2.closePath();cx2.stroke();

  // Labels
  cx2.fillStyle='rgba(255,255,255,0.5)';cx2.font='8px sans-serif';cx2.textAlign='center';
  cx2.fillText('ОПАСНО',barX+safeLow/2,barY+barH+12);
  cx2.fillText('БЕЗОПАСНО',barX+(safeLow+safeHigh)/2,barY+barH+12);
  cx2.fillText('ОПАСНО',barX+(barW+safeHigh)/2,barY+barH+12);

  // === Catch Progress Bar ===
  let cBarY=barY+barH+22;
  cx2.fillStyle='rgba(0,0,0,0.6)';
  cx2.beginPath();cx2.roundRect(barX-3,cBarY-3,barW+6,12+6,6);cx2.fill();
  // BG
  cx2.fillStyle='#2a1a05';
  cx2.beginPath();cx2.roundRect(barX,cBarY,barW,12,4);cx2.fill();
  // Fill
  let fillW=(catchProg/100)*barW;
  let fillGrad=cx2.createLinearGradient(barX,cBarY,barX+fillW,cBarY);
  fillGrad.addColorStop(0,'#4CAF50');fillGrad.addColorStop(1,'#8BC34A');
  cx2.fillStyle=fillGrad;
  cx2.beginPath();cx2.roundRect(barX,cBarY,fillW,12,4);cx2.fill();
  // Border
  cx2.strokeStyle='#8B6914';cx2.lineWidth=1;
  cx2.beginPath();cx2.roundRect(barX,cBarY,barW,12,4);cx2.stroke();
  // Text
  cx2.fillStyle='#ffd700';cx2.font='bold 8px sans-serif';cx2.textAlign='center';
  cx2.fillText('ВЫЛОВ '+(catchProg|0)+'%',barX+barW/2,cBarY+10);    // Fish name and struggle indicator during fight
  if(biteFish){
    cx2.fillStyle='rgba(0,0,0,0.5)';
    cx2.beginPath();cx2.roundRect(barX+barW/2-50,cBarY+20,100,20,6);cx2.fill();
    cx2.fillStyle='#ffd700';cx2.font='bold 11px sans-serif';cx2.textAlign='center';
    let extra=inStruggle?' 💥РЫВОК!':'';
    cx2.fillText(biteFish.type.emoji+' '+biteFish.type.name+extra,barX+barW/2,cBarY+33);
    // Direction indicator arrow
    cx2.font='16px sans-serif';
    cx2.fillStyle=tensionDir>0?'rgba(255,80,80,0.7)':'rgba(80,120,255,0.7)';
    cx2.textAlign='center';
    cx2.fillText(tensionDir>0?'◄ РЫВОК':'РЫВОК ►',barX+barW/2,cBarY+52);
  }
}

let lastT=0;
function loop(t){
  let dt=Math.min((t-lastT)/16,3);lastT=t;
  update(dt);draw();
  requestAnimationFrame(loop);
}
init();requestAnimationFrame(loop);
</script>
</body>
</html>
