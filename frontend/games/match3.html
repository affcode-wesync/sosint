<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сокровища Пиратов</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#e8e0d4;font-family:'Segoe UI',Tahoma,sans-serif;overflow:hidden;height:100dvh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.screen{display:none;flex-direction:column;align-items:center;width:100%;height:100dvh}
.screen.active{display:flex}
.menu{justify-content:center;gap:8px;padding:16px;overflow-y:auto}
.menu h1{font-size:clamp(22px,7vw,32px);background:linear-gradient(135deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.menu .sub{font-size:12px;color:#8b7355;margin-bottom:12px}
.coins{font-size:14px;color:#ffd700;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:400px;width:100%}
.btn{aspect-ratio:1;border-radius:8px;border:2px solid #2a2040;background:#1a1535;color:#8b7355;font-size:clamp(10px,2.5vw,13px);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn:hover{border-color:#ffd700;color:#ffd700}
.btn.done{background:#1a3a10;border-color:#4caf50;color:#4caf50}
.btn.cur{border-color:#ffd700;color:#ffd700}
.btn.lock{opacity:.3}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:rgba(0,0,0,.3);width:100%;flex-shrink:0}
.hdr button{background:none;border:1px solid rgba(255,215,0,.3);color:#ffd700;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600}
.hdr .info{font-size:13px;font-weight:700;color:#ffd700}
.stats{display:flex;gap:12px}
.stats .s{text-align:center}
.stats .sl{font-size:8px;color:#8b7355;text-transform:uppercase}
.stats .sv{font-size:16px;font-weight:700;color:#ffd700}
.stats .sv.mv{color:#ff6b6b}
.objs{display:flex;gap:12px;padding:4px;background:rgba(0,0,0,.2);width:100%;justify-content:center;flex-shrink:0;flex-wrap:wrap}
.obj{display:flex;align-items:center;gap:4px;font-size:11px}
.obj .g{width:16px;height:16px;border-radius:3px}
.obj .n{font-weight:700;color:#ffd700}
.area{flex:1;display:flex;align-items:center;justify-content:center;width:100%;overflow:hidden}
canvas{touch-action:none;display:block;border-radius:6px}
.gbar{display:flex;gap:8px;padding:6px;background:rgba(0,0,0,.25);width:100%;justify-content:center;flex-shrink:0}
.g{display:flex;flex-direction:column;align-items:center;padding:4px 10px;border-radius:6px;border:1px solid rgba(255,215,0,.15);background:rgba(255,215,0,.05);cursor:pointer;min-width:50px}
.g:active{transform:scale(.95)}
.g.on{background:rgba(255,215,0,.2);border-color:#ffd700}
.g .i{font-size:18px}
.g .t{font-size:8px;color:#8b7355}
.g .c{font-size:8px;color:#ffd700;font-weight:700}
.g .cnt{position:absolute;top:-2px;right:-2px;background:#ff4757;color:#fff;font-size:8px;font-weight:700;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(135deg,#1a1535,#0d1f3a);border:2px solid rgba(255,215,0,.3);border-radius:14px;padding:24px;text-align:center;max-width:300px;width:90%}
.modal h2{font-size:24px;margin-bottom:4px}
.modal h2.w{background:linear-gradient(135deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal h2.l{color:#ff6b6b}
.modal .st{font-size:24px;margin:8px 0}
.modal .sc{font-size:13px;color:#8b7355}
.modal .cn{font-size:13px;color:#ffd700;font-weight:700;margin:4px 0 12px}
.modal button{padding:8px 20px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin:0 4px}
.modal .p{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1535}
.modal .s2{background:rgba(255,255,255,.1);color:#ffd700;border:1px solid rgba(255,215,0,.3)}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:pf .6s ease-out forwards}
@keyframes pf{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.combo{position:absolute;font-size:20px;font-weight:800;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.5);pointer-events:none;animation:cf .8s ease-out forwards;z-index:60;left:50%;top:30%;transform:translateX(-50%)}
@keyframes cf{to{opacity:0;transform:translateX(-50%) translateY(-40px) scale(1.2)}}
</style>
</head>
<body>

<div class="screen menu active" id="ms">
  <a href="index.html" style="color:#ffd700;font-size:12px;opacity:.6;text-decoration:none;align-self:flex-start">← Игры</a>
  <h1>Сокровища Пиратов</h1>
  <div class="sub">Match-3 Adventure</div>
  <div class="coins" id="mc">🪙 0</div>
  <div class="grid" id="lg"></div>
</div>

<div class="screen" id="gs">
  <div class="hdr">
    <button onclick="toMenu()">←</button>
    <div class="info" id="li">Ур. 1</div>
    <div class="stats">
      <div class="s"><div class="sl">Очки</div><div class="sv" id="sv">0</div></div>
      <div class="s"><div class="sl">Ходы</div><div class="sv mv" id="mv">30</div></div>
    </div>
  </div>
  <div class="objs" id="of"></div>
  <div class="area" id="ga"><canvas id="cv"></canvas></div>
  <div class="gbar">
    <div class="g" id="gh" onclick="useG('hammer')"><span class="i">🔨</span><span class="t">Молот</span><span class="c">30🪙</span></div>
    <div class="g" id="gl" onclick="useG('lightning')"><span class="i">⚡</span><span class="t">Молния</span><span class="c">50🪙</span></div>
    <div class="g" id="gt2" onclick="useG('tornado')"><span class="i">🌪️</span><span class="t">Торнадо</span><span class="c">40🪙</span></div>
  </div>
</div>

<div class="modal-bg" id="mo"><div class="modal" id="mc2"></div></div>

<script>
const R=8,C=8,G=50,P=3,T=G+P;
const GEMS=[{c:'#ffd700',s:'★'},{c:'#ff4757',s:'♦'},{c:'#3498db',s:'●'},{c:'#2ecc71',s:'◆'},{c:'#9b59b6',s:'♠'},{c:'#e67e22',s:'♣'}];
const COST={hammer:30,lightning:50,tornado:40};
let gs=50,tot=50,lvls=[],cv,cx,sel=null,anim=false,sc=0,mv=30,co=parseInt(localStorage.getItem('m3c')||'100');
let inv=JSON.parse(localStorage.getItem('m3g')||'{"hammer":3,"lightning":1,"tornado":2}');
let done=JSON.parse(localStorage.getItem('m3d')||'[]');
let st={grid:null,lvl:null,idx:0,tmr:null,time:0,combo:0,obj:{},gadget:null};
let boardCache={};

function save(){localStorage.setItem('m3c',co);localStorage.setItem('m3g',JSON.stringify(inv));localStorage.setItem('m3d',JSON.stringify(done));}

function getBoard(n){
  if(boardCache[n])return boardCache[n];
  let b={};
  if(n<=10){boardCache[n]=b;return b;}
  let shapes=[
    ()=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(r<2||r>5||c<2||c>5)b[r+','+c]=1;}},
    ()=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++){let m=Math.abs(r-3.5);if(c<m-.5||c>7-m+.5)b[r+','+c]=1;}},
    ()=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(r%2===0&&c>=5)b[r+','+c]=1;if(r%2===1&&c<=2)b[r+','+c]=1;}},
    ()=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++){let d=Math.hypot(r-3.5,c-3.5);if(d>3.8)b[r+','+c]=1;}},
    ()=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(r<5&&c>2)b[r+','+c]=1;if(r>=5&&c===6)b[r+','+c]=1;}},
    ()=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++){if((r<2||r>5)&&(c<2||c>5))b[r+','+c]=1;}},
    ()=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(c<r-1||c>r+2)b[r+','+c]=1;}},
    ()=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++){let ar=Math.abs(r-3.5),ac=Math.abs(c-3.5);if(ar>1&&ac>1&&(ar+ac)>4)b[r+','+c]=1;}}
  ];
  shapes[(n-11)%shapes.length]();
  boardCache[n]=b;
  return b;
}

function mkLevels(){
  lvls=[];
  for(let i=1;i<=tot;i++){
    let o={},mv,tp;
    // 1-5: Easy - collect 1 color (fewer moves)
    if(i<=5){tp='c';o={t:'c',g:{},s:600+i*250};mv=30+~~(i*1.2);let g=~~(Math.random()*6);o.g[g]=10+i*2;}
    // 6-10: Collect 2-3 colors (tighter)
    else if(i<=10){tp='c';o={t:'c',g:{},s:1000+i*180};mv=28+i;let gc=~~(i/3)+2,gs2=new Set;while(gs2.size<gc)gs2.add(~~(Math.random()*6));gs2.forEach(g=>{o.g[g]=8+i*2;});}
    // 11-15: Break ice (more ice, fewer moves)
    else if(i<=15){tp='i';o={t:'i',ic:4+~~((i-10)*1.5),s:1500+i*120};mv=28+i;}
    // 16-20: Collect + score
    else if(i<=20){tp='cs';o={t:'cs',g:{},s:2200+i*200};mv=26+~~(i*.7);let gc=~~((i-15)/2)+2,gs2=new Set;while(gs2.size<gc)gs2.add(~~(Math.random()*6));gs2.forEach(g=>{o.g[g]=12+i;});}
    // 21-28: Timed (less time)
    else if(i<=28){tp='t';o={t:'t',tm:55+i,s:2500+i*160};mv=999;}
    // 29-35: Collect + ice combo
    else if(i<=35){tp='ci';o={t:'ci',g:{},ic:6+~~((i-28)*1.2),s:3000+i*120};mv=25+~~(i*.5);let gc=~~((i-28)/3)+2,gs2=new Set;while(gs2.size<gc)gs2.add(~~(Math.random()*6));gs2.forEach(g=>{o.g[g]=10+i;});}
    // 36-42: Hard (collect + ice + fewer moves)
    else if(i<=42){tp='h';o={t:'h',g:{},ic:7+~~((i-35)*1.3),s:3800+i*120};mv=24+~~(i*.35);let gc=~~((i-35)/3)+3,gs2=new Set;while(gs2.size<gc)gs2.add(~~(Math.random()*6));gs2.forEach(g=>{o.g[g]=14+i;});}
    // 43-50: Chains + ice + tough
    else if(i<=50){tp='ch';o={t:'ch',g:{},cc:5+~~((i-42)*1.2),ic:4+~~((i-42)/2),s:4500+i*100};mv=22+~~(i*.3);let gc=~~((i-42)/2)+3,gs2=new Set;while(gs2.size<gc)gs2.add(~~(Math.random()*6));gs2.forEach(g=>{o.g[g]=15+i;});}
    let stars=o.t==='t'?[o.s,o.s*1.5,o.s*2.2]:[o.s,o.s*1.4,o.s*2];
    lvls.push({id:i,tp,mv,o,stars,board:getBoard(i)});
  }
}

// ======== CANVAS ========
function resize(){
  let a=document.getElementById('ga');
  if(!a||a.clientWidth<10)return;
  let aw=a.clientWidth-4,ah=a.clientHeight-4;
  let bw=C*T+P,bh=R*T+P;
  let s=Math.min(aw/bw,ah/bh,1.2);
  gs=Math.max(20,~~(50*s));
  let gt=gs+P,w=C*gt+P,h=R*gt+P;
  let d=window.devicePixelRatio||1;
  cv.width=~~(w*d);cv.height=~~(h*d);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cx.setTransform(d,0,0,d,0,0);
}

// ======== MENU ========
function showMenu(){
  document.getElementById('ms').classList.add('active');
  document.getElementById('gs').classList.remove('active');
  document.getElementById('mc').textContent='🪙 '+co;
  let g=document.getElementById('lg'),f=document.createDocumentFragment();
  g.innerHTML='';
  for(let i=0;i<tot;i++){
    let b=document.createElement('div');b.className='btn';
    let d=done.includes(i),u=i===0||done.includes(i-1);
    if(d)b.classList.add('done');
    if(u&&!d&&i===Math.max(0,done.length))b.classList.add('cur');
    if(!u)b.classList.add('lock');
    b.textContent=i+1;
    b.onclick=()=>{if(u)startLvl(i);};
    f.appendChild(b);
  }
  g.appendChild(f);
}

function toMenu(){if(st.tmr)clearInterval(st.tmr);st.gadget=null;hideModal();showMenu();}

// ======== START ========
function startLvl(idx){
  st.idx=idx;st.lvl=lvls[idx];sc=0;mv=st.lvl.mv;st.combo=0;sel=null;anim=false;st.gadget=null;st.obj={};
  let o=st.lvl.o;
  if(o.g)for(let g in o.g)st.obj[g]={n:o.g[g],d:0};
  if(o.ic&&(o.t==='i'||o.t==='ci'||o.t==='h'||o.t==='ch'||o.t==='th'||o.t==='b'))st.obj._i={n:o.ic,d:0};
  if(o.cc&&(o.t==='ch'||o.t==='b'))st.obj._c={n:o.cc,d:0};
  if(o.t==='cs'||o.t==='t'||o.t==='th')st.obj._s={n:o.s,d:0};
  document.getElementById('ms').classList.remove('active');
  document.getElementById('gs').classList.add('active');
  setTimeout(resize,10);
  setTimeout(()=>{
    resize();
    document.getElementById('li').textContent='Ур. '+(idx+1);
    document.getElementById('sv').textContent='0';
    document.getElementById('mv').textContent=o.t==='t'||o.t==='th'?fmtT(o.tm):mv;
    document.getElementById('mv').className=o.t==='t'||o.t==='th'?'sv':'sv mv';
    renderObjs();initGrid();draw();
    if(st.tmr)clearInterval(st.tmr);
    if(o.t==='t'||o.t==='th'){
      st.time=o.tm;document.getElementById('mv').textContent=fmtT(st.time);
      st.tmr=setInterval(()=>{st.time--;document.getElementById('mv').textContent=fmtT(st.time);if(st.time<=0){clearInterval(st.tmr);chkEnd();}},1000);
    }
    setTimeout(()=>{if(!hasMoves())shuffle();},300);
  },20);
}

function fmtT(s){return~~(s/60)+':'+(s%60<10?'0':'')+(s%60);}

// ======== OBJECTIVES ========
function renderObjs(){
  let f=document.getElementById('of');f.innerHTML='';
  for(let k in st.obj){
    let o=st.obj[k],d=document.createElement('div');d.className='obj';
    let col,txt;
    if(k==='_i'){col='rgba(200,230,255,.4)';txt='Лёд';}
    else if(k==='_c'){col='#888';txt='Цепи';}
    else if(k==='_s'){col='linear-gradient(135deg,#ffd700,#ff8c00)';txt='Очков';}
    else{col=GEMS[~~k].c;txt=GEMS[~~k].s;}
    d.innerHTML=`<div class="g" style="background:${col}"></div><span class="n" id="o_${k}">0/${o.n}</span><span style="font-size:10px;color:#8b7355">${txt}</span>`;
    f.appendChild(d);
  }
}
function updObjs(){for(let k in st.obj){let e=document.getElementById('o_'+k);if(e)e.textContent=st.obj[k].d+'/'+st.obj[k].n;}}

// ======== GRID ========
function initGrid(){
  let b=st.lvl.board,gt=gs+P;
  st.grid=[];
  for(let r=0;r<R;r++){st.grid[r]=[];for(let c=0;c<C;c++){
    if(b[r+','+c]){st.grid[r][c]={b:1};continue;}
    let g;do{g=~~(Math.random()*6);}
    while((c>=2&&st.grid[r][c-1]&&!st.grid[r][c-1].b&&st.grid[r][c-1].t===g&&st.grid[r][c-2]&&!st.grid[r][c-2].b&&st.grid[r][c-2].t===g)
      ||(r>=2&&st.grid[r-1][c]&&!st.grid[r-1][c].b&&st.grid[r-1][c].t===g&&st.grid[r-2][c]&&!st.grid[r-2][c].b&&st.grid[r-2][c].t===g));
    st.grid[r][c]={t:g,x:c*gt+P,y:r*gt+P};
  }}
}

// ======== DRAW ========
function draw(){
  if(!cx||gs<10)return;
  let gt=gs+P,b=st.lvl?st.lvl.board:{};
  cx.clearRect(0,0,cv.width/(window.devicePixelRatio||1),cv.height/(window.devicePixelRatio||1));
  cx.fillStyle='#0d0d1a';cx.fillRect(0,0,cv.width,cv.height);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    if(b[r+','+c])continue;
    let cell=st.grid?.[r]?.[c];if(!cell||cell.b||cell.m)continue;
    let x=cell.x,y=cell.y;
    let gm=GEMS[cell.t];
    let gl=cx.createRadialGradient(x+gs/2,y+gs/2,0,x+gs/2,y+gs/2,gs/2);
    gl.addColorStop(0,gm.c+'40');gl.addColorStop(1,'transparent');
    cx.fillStyle=gl;cx.fillRect(x,y,gs,gs);
    cx.fillStyle=gm.c;cx.beginPath();cx.roundRect(x+2,y+2,gs-4,gs-4,6);cx.fill();
    let ig=cx.createLinearGradient(x,y,x+gs,y+gs);
    ig.addColorStop(0,'rgba(255,255,255,.2)');ig.addColorStop(1,'rgba(0,0,0,.1)');
    cx.fillStyle=ig;cx.beginPath();cx.roundRect(x+2,y+2,gs-4,gs-4,6);cx.fill();
    cx.fillStyle='rgba(255,255,255,.9)';cx.font=`bold ${~~(gs*.35)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(gm.s,x+gs/2,y+gs/2+1);
    if(sel&&sel.r===r&&sel.c===c){
      cx.strokeStyle='#ffd700';cx.lineWidth=2;cx.shadowColor='#ffd700';cx.shadowBlur=8;
      cx.beginPath();cx.roundRect(x+1,y+1,gs-2,gs-2,8);cx.stroke();cx.shadowBlur=0;
    }
  }
}

// ======== INPUT ========
cv=document.getElementById('cv');
cx=cv.getContext('2d');
let sx,sy,dr=false;
cv.addEventListener('pointerdown',e=>{
  if(anim)return;e.preventDefault();
  let rect=cv.getBoundingClientRect();
  let x=e.clientX-rect.left,y=e.clientY-rect.top;
  let gt=gs+P,c2=~~(x/gt),r2=~~(y/gt);
  if(r2<0||r2>=R||c2<0||c2>=C)return;
  if(st.lvl?.board[r2+','+c2])return;
  if(st.gadget){doGadget(r2,c2);return;}
  sx=x;sy=y;dr=true;
  if(sel){
    let sr=sel.r,sc2=sel.c;
    if(Math.abs(sr-r2)+Math.abs(sc2-c2)===1){trySwap(sr,sc2,r2,c2);sel=null;return;}
  }
  sel={r:r2,c:c2};draw();
});
cv.addEventListener('pointermove',e=>{
  if(!dr||anim||st.gadget)return;
  let rect=cv.getBoundingClientRect();
  let x=e.clientX-rect.left,y=e.clientY-rect.top;
  if(Math.abs(x-sx)>gs*.25||Math.abs(y-sy)>gs*.25){
    let gt=gs+P,r2=~~(sy/gt),c2=~~(sx/gt);
    let tr=r2,tc=c2;
    if(Math.abs(x-sx)>Math.abs(y-sy))tc+=x>sx?1:-1;else tr+=y>sy?1:-1;
    if(tr>=0&&tr<R&&tc>=0&&tc<C&&!st.lvl?.board[tc+','+tr]){dr=false;trySwap(r2,c2,tr,tc);sel=null;}
  }
});
cv.addEventListener('pointerup',()=>{dr=false;});
cv.addEventListener('pointercancel',()=>{dr=false;});

// ======== SWAP ========
async function trySwap(r1,c1,r2,c2){
  if(anim)return;anim=true;st.combo=0;
  await animSwap(r1,c1,r2,c2);
  let m=findM();
  if(!m.length){await animSwap(r1,c1,r2,c2);anim=false;return;}
  if(st.lvl.o.t!=='t'&&st.lvl.o.t!=='th'){mv--;document.getElementById('mv').textContent=mv;}
  await procM(m);anim=false;
  chkEnd();
}

function animSwap(r1,c1,r2,c2){
  return new Promise(res=>{
    let gt=gs+P,a=st.grid[r1][c1],b=st.grid[r2][c2];
    let sx1=a.x,sy1=a.y,sx2=b.x,sy2=b.y;
    let tx1=c2*gt+P,ty1=r2*gt+P,tx2=c1*gt+P,ty2=r1*gt+P;
    let d=100,s=performance.now();
    function step(now){
      let t=Math.min((now-s)/d,1);t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      a.x=sx1+(tx1-sx1)*t;a.y=sy1+(ty1-sy1)*t;
      b.x=sx2+(tx2-sx2)*t;b.y=sy2+(ty2-sy2)*t;
      draw();
      if(t<1)requestAnimationFrame(step);
      else{st.grid[r1][c1]=b;st.grid[r2][c2]=a;a.x=tx1;a.y=ty1;b.x=tx2;b.y=ty2;res();}
    }
    requestAnimationFrame(step);
  });
}

// ======== MATCHES ========
function findM(){
  let m=new Set,b=st.lvl?.board||{};
  for(let r=0;r<R;r++)for(let c=0;c<C-2;c++){
    let cl=st.grid[r][c];if(!cl||cl.b||cl.m)continue;
    let l=1;while(c+l<C){let n=st.grid[r][c+l];if(!n||n.b||n.m||n.t!==cl.t)break;l++;}
    if(l>=3)for(let i=0;i<l;i++)m.add(r+','+(c+i));
  }
  for(let c=0;c<C;c++)for(let r=0;r<R-2;r++){
    let cl=st.grid[r][c];if(!cl||cl.b||cl.m)continue;
    let l=1;while(r+l<R){let n=st.grid[r+l][c];if(!n||n.b||n.m||n.t!==cl.t)break;l++;}
    if(l>=3)for(let i=0;i<l;i++)m.add((r+i)+','+c);
  }
  return[...m].map(s=>{let[r,c]=s.split(',').map(Number);return{r,c};});
}

async function procM(matches){
  let ex=new Set();
  matches.forEach(m=>ex.add(m.r+','+m.c));
  let all=[...ex].map(s=>{let[r,c]=s.split(',').map(Number);return{r,c};});
  st.combo++;
  sc+=all.length*10*st.combo;
  document.getElementById('sv').textContent=sc;
  if(st.obj._s){st.obj._s.d=sc;updObjs();}
  let gt=gs+P;
  for(let m of all){
    let cl=st.grid[m.r][m.c];if(!cl||cl.b)continue;
    if(cl.t>=0&&st.obj[cl.t]){st.obj[cl.t].d++;updObjs();}
    spawnP(m.c*gt+P+gs/2,m.r*gt+P+gs/2,GEMS[cl.t].c);
    cl.m=1;
  }
  if(st.combo>=2)showCombo(st.combo);
  await sleep(150);
  for(let m of all)st.grid[m.r][m.c]=null;
  draw();await drop();await fill();
  let nm=findM();if(nm.length)await procM(nm);
}

async function drop(){
  let gt=gs+P,b=st.lvl.board;
  for(let c=0;c<C;c++){let e=0;
    for(let r=R-1;r>=0;r--){if(b[r+','+c]){e=0;continue;}if(!st.grid[r][c])e++;else if(e>0){let cl=st.grid[r][c];st.grid[r][c]=null;st.grid[r+e][c]=cl;cl.ty=(r+e)*gt+P;cl.fy=cl.y;cl.fl=1;}}
  }
  await animFall();
}

async function fill(){
  let gt=gs+P,b=st.lvl.board;
  for(let c=0;c<C;c++){let e=0;
    for(let r=0;r<R;r++){if(!b[r+','+c]&&!st.grid[r][c])e++;}
    for(let r=0;r<R;r++){if(!b[r+','+c]&&!st.grid[r][c]){
      let g=~~(Math.random()*6);
      st.grid[r][c]={t:g,x:c*gt+P,y:(r-e)*gt-P,ty:r*gt+P,fy:(r-e)*gt-P,fl:1};
    }}
  }
  await animFall();
}

function animFall(){
  return new Promise(res=>{
    let d=150,s=performance.now();
    function step(now){
      let t=Math.min((now-s)/d,1);t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      let any=false;
      for(let r=0;r<R;r++)for(let c=0;c<C;c++){let cl=st.grid[r][c];if(!cl||cl.b)continue;if(cl.fl){any=true;cl.y=cl.fy+(cl.ty-cl.fy)*t;if(t>=1){cl.y=cl.ty;cl.fl=0;}}}
      draw();
      if(any&&t<1)requestAnimationFrame(step);else res();
    }
    requestAnimationFrame(step);
  });
}

// ======== MOVES CHECK ========
function hasMoves(){
  let b=st.lvl.board;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    if(b[r+','+c]||!st.grid[r][c]||st.grid[r][c].b)continue;
    if(c<C-1&&!b[(c+1)+','+r]&&st.grid[r][c+1]&&!st.grid[r][c+1].b){
      swT(r,c,r,c+1);let m=findM().length;swT(r,c,r,c+1);if(m)return true;}
    if(r<R-1&&!b[c+','+(r+1)]&&st.grid[r+1][c]&&!st.grid[r+1][c].b){
      swT(r,c,r+1,c);let m=findM().length;swT(r,c,r+1,c);if(m)return true;}
  }
  return false;
}
function swT(r1,c1,r2,c2){let a=st.grid[r1][c1],b=st.grid[r2][c2],t=a.t;a.t=b.t;b.t=t;}

async function shuffle(){
  let b=st.lvl.board,all=[];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){let cl=st.grid[r][c];if(cl&&!cl.b)all.push(cl.t);}
  for(let i=all.length-1;i>0;i--){let j=~~(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  let idx=0;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){let cl=st.grid[r][c];if(cl&&!cl.b)cl.t=all[idx++];}
  draw();
  let m=findM();if(m.length)await procM(m);
  if(!hasMoves())await shuffle();
}

// ======== GADGETS ========
function useG(type){
  if(anim)return;
  let cnt=inv[type]||0,cost=COST[type];
  if(cnt<=0&&co<cost)return;
  if(type==='tornado'){doTornado();return;}
  st.gadget=st.gadget===type?null:type;
}
async function doTornado(){
  let cnt=inv.tornado||0;if(cnt<=0&&co<COST.tornado)return;
  if(cnt>0)inv.tornado--;else co-=COST.tornado;save();
  st.gadget=null;anim=true;
  await shuffle();
  anim=false;chkEnd();
}
async function doGadget(r,c){
  if(anim)return;anim=true;
  let type=st.gadget;
  let cnt=inv[type]||0;if(cnt>0)inv[type]--;else co-=COST[type];save();
  st.gadget=null;
  let gt=gs+P,cl=st.grid[r][c];
  if(type==='hammer'&&cl&&!cl.b){
    if(cl.t>=0&&st.obj[cl.t]){st.obj[cl.t].d++;updObjs();}
    spawnP(c*gt+P+gs/2,r*gt+P+gs/2,GEMS[cl.t].c);
    st.grid[r][c]=null;
  }else if(type==='lightning'&&cl&&!cl.b){
    let tt=cl.t,cnt2=0;
    for(let rr=0;rr<R;rr++)for(let cc=0;cc<C;cc++){
      let cl2=st.grid[rr][cc];if(cl2&&!cl2.b&&cl2.t===tt){
        if(st.obj[tt]){st.obj[tt].d++;updObjs();}
        spawnP(cc*gt+P+gs/2,rr*gt+P+gs/2,GEMS[tt].c);st.grid[rr][cc]=null;cnt2++;
      }
    }
    sc+=cnt2*15;document.getElementById('sv').textContent=sc;
  }
  draw();await sleep(150);await drop();await fill();
  let m=findM();if(m.length)await procM(m);
  anim=false;chkEnd();
}

// ======== END ========
function chkEnd(){
  let o=st.lvl.o;
  if((st.tmr&&(o.t==='t'||o.t==='th'))&&st.time<=0){
    (!st.obj._s||sc>=st.obj._s.n)?win():lose();return;}
  let ok=true;for(let k in st.obj)if(st.obj[k].d<st.obj[k].n){ok=false;break;}
  if(ok){win();return;}
  if(mv<=0&&o.t!=='t'&&o.t!=='th')lose();
}

function win(){
  if(st.tmr)clearInterval(st.tmr);
  let o=st.lvl.o;
  let s=sc>=o.stars[2]?3:sc>=o.stars[1]?2:1;
  let cn=10+s*10+~~(sc/200);co+=cn;
  if(!done.includes(st.idx))done.push(st.idx);save();
  showModal(`<h2 class="w">Победа!</h2><div class="st">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><div class="sc">Очки: ${sc}</div><div class="cn">+${cn} 🪙</div><button class="p" onclick="next()">Далее →</button><button class="s2" onclick="toMenu()">Меню</button>`);
}

function lose(){
  if(st.tmr)clearInterval(st.tmr);
  showModal(`<h2 class="l">Поражение</h2><div class="sc">Попробуйте ещё раз</div><button class="p" onclick="startLvl(${st.idx})">Заново</button><button class="s2" onclick="toMenu()">Меню</button>`);
}

function next(){hideModal();if(st.idx<tot-1)startLvl(st.idx+1);else toMenu();}

function showModal(h){document.getElementById('mc2').innerHTML=h;document.getElementById('mo').classList.add('show');}
function hideModal(){document.getElementById('mo').classList.remove('show');}

function spawnP(x,y,col){
  let a=document.getElementById('ga');
  for(let i=0;i<4;i++){let p=document.createElement('div');p.className='particle';
    p.style.cssText=`left:${x}px;top:${y}px;width:${3+Math.random()*3}px;height:${3+Math.random()*3}px;background:${col};--dx:${(Math.random()-.5)*50}px;--dy:${(Math.random()-.5)*50-10}px`;
    a.appendChild(p);setTimeout(()=>p.remove(),500);}
}
function showCombo(n){let e=document.createElement('div');e.className='combo';e.textContent=(n>=5?'MEGA':'COMBO')+' ×'+n;document.getElementById('ga').appendChild(e);setTimeout(()=>e.remove(),700);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

window.addEventListener('resize',()=>{if(document.getElementById('gs').classList.contains('active')){resize();if(st.grid){let gt=gs+P;for(let r=0;r<R;r++)for(let c=0;c<C;c++){let cl=st.grid[r][c];if(cl&&!cl.b&&!cl.fl){cl.x=c*gt+P;cl.y=r*gt+P;}}}draw();}});

mkLevels();showMenu();
</script>
