[build]
  publish = "frontend"
  command = "echo 'Static site - no build needed'"

# Redirect API calls to backend
[[redirects]]
  from = "/api/*"
  to = "https://sosint-api.onrender.com/api/:splat"
  status = 200
  force = true

# Serve map page
[[redirects]]
  from = "/map"
  to = "/map/index.html"
  status = 200

[[redirects]]
  from = "/map/*"
  to = "/map/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = [{Type = "application/json", Status = "404"}]

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache"
