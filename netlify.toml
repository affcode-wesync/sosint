[build]
  publish = "frontend"
  functions = "netlify/functions"
  command = "echo 'Static site with Netlify Functions'"

# Auth routes
[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/status"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

# Admin routes - all go to auth-admin
[[redirects]]
  from = "/api/auth/admin/*"
  to = "/.netlify/functions/auth-admin"
  status = 200
  force = true

# Analysis routes
[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200
  force = true

[[redirects]]
  from = "/api/analyze/export"
  to = "/.netlify/functions/analyze"
  status = 200
  force = true

# HLR routes
[[redirects]]
  from = "/api/hlr"
  to = "/.netlify/functions/hlr"
  status = 200
  force = true

[[redirects]]
  from = "/api/hlr/export"
  to = "/.netlify/functions/hlr"
  status = 200
  force = true

# Sherlock routes
[[redirects]]
  from = "/api/sherlock"
  to = "/.netlify/functions/sherlock"
  status = 200
  force = true

[[redirects]]
  from = "/api/sherlock/export"
  to = "/.netlify/functions/sherlock"
  status = 200
  force = true

# Face search routes
[[redirects]]
  from = "/api/face-search"
  to = "/.netlify/functions/face-search"
  status = 200
  force = true

[[redirects]]
  from = "/api/face-search/url"
  to = "/.netlify/functions/face-search"
  status = 200
  force = true

# Health check
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

# Map page
[[redirects]]
  from = "/map"
  to = "/map/index.html"
  status = 200

[[redirects]]
  from = "/map/*"
  to = "/map/:splat"
  status = 200

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache"
